components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: tsw_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccountSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - name_asc
    WorkspaceSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - updated_desc
          - name_asc
          - active_until_asc
    WorkspaceStateFilter:
      name: operational_state
      in: query
      schema:
        type: string
        enum:
          - unknown
          - operational
          - deactivated
          - not_found
    ObservationPage:
      name: observation_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ObservationPageSize:
      name: observation_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemberPage:
      name: member_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    MemberPageSize:
      name: member_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TargetSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - identifier_asc
          - probed_desc
    TargetStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - disabled
    TargetProbeStatusFilter:
      name: probe_status
      in: query
      schema:
        type: string
        enum:
          - available
          - credential_invalid
          - account_problem
          - definitely_unavailable
          - transient_failure
          - unknown
          - unprobed
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 254
    BindingId:
      name: binding_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    TargetPage:
      name: target_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    TargetPageSize:
      name: target_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReadId:
      name: readId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StandbyBatchId:
      name: standbyBatchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountId:
      name: targetAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProbeId:
      name: probeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountIdQuery:
      name: target_account_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    DeliveryServiceStatusQuery:
      name: service_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryServiceFilter'
    DeliveryCardStatusQuery:
      name: card_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryCardFilter'
    DeliveryOrderStatusQuery:
      name: order_status
      in: query
      schema:
        $ref: '#/components/schemas/DeliveryOrderFilter'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    OperationDraftBatchChild:
      type: object
      additionalProperties: false
      required: [accountId, identifier, membershipVersion, materialStatus]
      properties:
        accountId:
          type: string
          format: uuid
        identifier:
          type: string
        membershipVersion:
          type: integer
          format: int64
        materialStatus:
          type: string
          enum: [complete, needs_totp]
    OperationDraftBatchChildren:
      type: object
      additionalProperties: false
      required: [batchId, batchVersion, total, items]
      properties:
        batchId:
          type: string
          format: uuid
        batchVersion:
          type: integer
          format: int64
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperationDraftBatchChild'
    OperationDraftChild:
      type: object
      additionalProperties: false
      required: [accountId, membershipVersion]
      properties:
        accountId:
          type: string
          format: uuid
        membershipVersion:
          type: integer
          format: int64
    RotationRemovalAction:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: {type: boolean}
    RotationRemovalStart:
      type: object
      additionalProperties: false
      required: [confirmed, authorizationDigest, idempotencyKey]
      properties:
        confirmed: {type: boolean}
        authorizationDigest: {type: string, pattern: '^[a-f0-9]{64}$'}
        idempotencyKey: {type: string, format: uuid}
    RotationRemoval:
