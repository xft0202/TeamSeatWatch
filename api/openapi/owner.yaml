---
openapi: 3.1.0
info:
  title: Apophis-TeamSeatWatch Owner API
  version: 1.0.0
  description: Owner authentication and login-security operations.
paths:
  /api/owner/v1/csrf:
    get:
      operationId: getOwnerCsrf
      responses:
        '200':
          description: CSRF token and matching secure cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/login:
    post:
      operationId: loginOwner
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Authenticated with a newly issued session cookie
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/logout:
    post:
      operationId: logoutOwner
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Current session revoked
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/auth-status:
    get:
      operationId: getOwnerAuthStatus
      security:
        - ownerSession: []
      responses:
        '200':
          description: Current Owner authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/session/refresh:
    post:
      operationId: refreshOwnerSession
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: >-
            Idle deadline refreshed within the absolute session lifetime
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/sessions:
    get:
      operationId: listOwnerSessions
      security:
        - ownerSession: []
      responses:
        '200':
          description: Active Owner sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/sessions/{sessionId}:
    delete:
      operationId: revokeOwnerSession
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: >-
            Target session revoked; a surviving current session is rotated
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/operation-draft/batches/{standbyBatchId}/children:
    get:
      operationId: listOperationDraftBatchChildren
      description: Paged identifiers for the wizard; not a frozen selection.
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/StandbyBatchId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Current standby batch child labels and versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDraftBatchChildren'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/operation-draft:
    get:
      operationId: getOperationDraft
      security:
        - ownerSession: []
      responses:
        '200':
          description: Current selection-only draft; no operation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDraft'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: startOperationDraft
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Resume existing draft or create an empty draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDraft'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: changeOperationDraft
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationDraftChange'
      responses:
        '200':
          description: Versioned selection or backtracking; never executes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationDraft'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews:
    post:
      operationId: previewExpiryRotation
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Frozen non-executing review of current evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryRotationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/latest:
    get:
      operationId: getLatestExpiryRotationPreview
      security:
        - ownerSession: []
      responses:
        '200':
          description: Most recent persisted preview; may be stale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryRotationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}:
    parameters:
      - name: previewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getExpiryRotationPreview
      security:
        - ownerSession: []
      responses:
        '200':
          description: Persisted preview or revocable authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryRotationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/confirm:
    post:
      operationId: confirmExpiryRotation
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpiryRotationConfirmation'
      responses:
        '200':
          description: Frozen, writer-fenced authorization; no remote
            mutation is dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryRotationPreview'
        '409':
          description: Preview, permission, evidence, assignment, or
            idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/revoke:
    post:
      operationId: revokeExpiryRotation
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Revoked before any remote mutation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiryRotationPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/removals:
    get:
      operationId: listRotationRemovals
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Persisted owner removal history; no remote action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemovalHistory'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal:
    post:
      operationId: startRotationRemoval
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationRemovalStart'
      responses:
        '200':
          description: Persisted per-slot removal progress; a receipt is
            never vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemoval'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: getRotationRemoval
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Durable progress, including unresolved sent requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemoval'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/run:
    post:
      operationId: runRotationRemovalSlot
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationRemovalAction'
      responses:
        '200':
          description: Persisted per-slot removal progress; a receipt is
            never vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemoval'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/verify:
    post:
      operationId: verifyRotationRemovalSlot
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationRemovalAction'
      responses:
        '200':
          description: Persisted per-slot removal progress; a receipt is
            never vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemoval'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/channel-delivery:
    get:
      operationId: getChannelDelivery
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Original object channel evidence and unfinished obligations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelDeliveryStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/channel-delivery/receive:
    post:
      operationId: receiveChannelDelivery
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Original object channel evidence and unfinished obligations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelDeliveryStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/channel-delivery/reconcile:
    post:
      operationId: reconcileChannelDelivery
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Original object channel evidence and unfinished obligations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelDeliveryStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/batch-zip:
    get:
      operationId: getBatchZIPStatus
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Redacted original batch package state; generation is not customer delivery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchZIPStatus'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: generateBatchZIP
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Complete immutable original package and object association committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BatchZIPStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/batch-zip/download:
    get:
      operationId: downloadBatchZIP
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Owner-authorized original immutable ZIP bytes
          content:
            application/zip:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join:
    get:
      operationId: getRotationJoinStatus
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Redacted original-intent join and credential status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/run:
    post:
      operationId: runRotationJoin
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/verify:
    post:
      operationId: verifyRotationJoin
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/save:
    post:
      operationId: saveRotationJoinCredentials
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/repair:
    post:
      operationId: repairRotationJoinCredentials
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/usage:
    post:
      operationId: observeRotationJoinUsage
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/slots/{slotId}/join/usage/recheck:
    post:
      operationId: recheckRotationJoinUsage
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: slotId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotationJoinAction'}
      responses:
        '200':
          description: Durable redacted original-intent status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RotationJoinStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/expiry-rotation/previews/{previewId}/removal/stop:
    post:
      operationId: stopRotationRemoval
      security:
        - ownerSession: []
      parameters:
        - name: previewId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationRemovalAction'
      responses:
        '200':
          description: Persisted per-slot removal progress; a receipt is
            never vacancy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotationRemoval'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts:
    get:
      operationId: listMotherAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountSort'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated administrator accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccountList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createMotherAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMotherAccount'
      responses:
        '201':
          description: Administrator account created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts/import:
    post:
      operationId: importMotherAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMotherAccounts'
      responses:
        '200':
          description: Per-line material import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccountImportResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts/export:
    post:
      operationId: exportMotherAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportMotherAccounts'
      responses:
        '200':
          description: Confirmed material export for the current Owner session
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts/{accountId}:
    patch:
      operationId: updateMotherAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMotherAccount'
      responses:
        '200':
          description: Administrator account updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/delivery-destinations:
    get:
      operationId: listDeliveryDestinations
      security:
        - ownerSession: []
      responses:
        '200':
          description: Owner delivery destinations with redacted secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDestinationList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createDeliveryDestination
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeliveryDestination'
      responses:
        '201':
          description: Delivery destination created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryDestination'
