---
openapi: 3.1.0
info:
  title: TeamSeatWatch Owner API
  version: 1.0.0
  description: Owner authentication and login-security operations.
paths:
  /api/owner/v1/csrf:
    get:
      operationId: getOwnerCsrf
      responses:
        '200':
          description: CSRF token and matching secure cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/login:
    post:
      operationId: loginOwner
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Authenticated with a newly issued session cookie
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/logout:
    post:
      operationId: logoutOwner
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Current session revoked
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/auth-status:
    get:
      operationId: getOwnerAuthStatus
      security:
        - ownerSession: []
      responses:
        '200':
          description: Current Owner authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/session/refresh:
    post:
      operationId: refreshOwnerSession
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: >-
            Idle deadline refreshed within the absolute session lifetime
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/sessions:
    get:
      operationId: listOwnerSessions
      security:
        - ownerSession: []
      responses:
        '200':
          description: Active Owner sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/sessions/{sessionId}:
    delete:
      operationId: revokeOwnerSession
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: >-
            Target session revoked; a surviving current session is rotated
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts:
    get:
      operationId: listMotherAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountSort'
      responses:
        '200':
          description: Paginated administrator accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccountList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createMotherAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMotherAccount'
      responses:
        '201':
          description: Administrator account created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/mother-accounts/{accountId}:
    patch:
      operationId: updateMotherAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMotherAccount'
      responses:
        '200':
          description: Administrator account updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotherAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspaces:
    get:
      operationId: listWorkspaces
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/WorkspaceSort'
        - $ref: '#/components/parameters/WorkspaceStateFilter'
      responses:
        '200':
          description: Paginated Workspace projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createWorkspace
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspace'
      responses:
        '201':
          description: Workspace created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspaces/needs-attention:
    get:
      operationId: listWorkspacesNeedingAttention
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Projection-only attention list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspaces/{workspaceId}:
    get:
      operationId: getWorkspace
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ObservationPage'
        - $ref: '#/components/parameters/ObservationPageSize'
        - $ref: '#/components/parameters/MemberPage'
        - $ref: '#/components/parameters/MemberPageSize'
      responses:
        '200':
          description: Workspace fact detail
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetail'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateWorkspace
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspace'
      responses:
        '200':
          description: Workspace updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/bindings:
    post:
      operationId: createMotherWorkspaceBinding
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBinding'
      responses:
        '201':
          description: Current account-Workspace relationship created
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Binding'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspaces/{workspaceId}/refresh:
    post:
      operationId: refreshWorkspaceFacts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshWorkspaceRequest'
      responses:
        '202':
          description: Stable asynchronous read status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceReadStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspace-reads/{readId}:
    get:
      operationId: getWorkspaceReadStatus
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/ReadId'
      responses:
        '200':
          description: Pure read of asynchronous status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceReadStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/workspaces/{workspaceId}/manual-verification:
    post:
      operationId: createWorkspaceManualVerification
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualVerificationRequest'
      responses:
        '200':
          description: Manual verification and recomputed projection
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-accounts:
    get:
      operationId: listTargetAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/TargetSort'
        - $ref: '#/components/parameters/TargetStatusFilter'
        - $ref: '#/components/parameters/TargetProbeStatusFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Paginated target accounts without secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccountList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createTargetAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetAccount'
      responses:
        '201':
          description: Target account saved; secret values are never returned
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-accounts/import-preview:
    post:
      operationId: previewTargetAccountImport
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetAccountImportRequest'
      responses:
        '200':
          description: Parsed target-account import without secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccountImportPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-accounts/import:
    post:
      operationId: importTargetAccounts
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetAccountImportRequest'
      responses:
        '200':
          description: Import result without secret values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccountImportResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-accounts/{targetAccountId}:
    get:
      operationId: getTargetAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/TargetAccountId'
      responses:
        '200':
          description: Target account and independent Workspace plans
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccountDetail'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateTargetAccount
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/TargetAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTargetAccount'
      responses:
        '200':
          description: Target account and optional credentials updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetAccount'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-account-probes:
    post:
      operationId: createTargetAccountProbes
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTargetAccountProbes'
      responses:
        '202':
          description: >-
            Durable target probes queued using the current server filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetProbeBatch'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/target-account-probes/{probeId}:
    get:
      operationId: getTargetAccountProbe
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/ProbeId'
      responses:
        '200':
          description: Pure read of a durable target probe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetProbeStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches:
    get:
      operationId: listBatches
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/BindingId'
      responses:
        '200':
          description: Paginated batches for one current binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchList'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createBatch
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveBatch'
      responses:
        '201':
          description: Side-effect-free batch plan saved
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}:
    get:
      operationId: getBatch
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/TargetPage'
        - $ref: '#/components/parameters/TargetPageSize'
      responses:
        '200':
          description: Batch plan and persisted paged target selection
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDetail'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateBatch
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBatch'
      responses:
        '200':
          description: Unconfirmed plan updated without platform side effects
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}/preview:
    get:
      operationId: getBatchPreview
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/TargetPage'
        - $ref: '#/components/parameters/TargetPageSize'
      responses:
        '200':
          description: >-
            Current evidence and capacity preview; this endpoint is read-only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}/join-preview:
    get:
      operationId: getBatchJoinPreview
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: >-
            Current evidence for the entire planned batch before authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinPreview'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}/join:
    post:
      operationId: createJoinOperation
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '202':
          description: Durable whole-batch join operation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOperation'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}/join-reconcile:
    post:
      operationId: createJoinReconciliation
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshJoinRequest'
      responses:
        '202':
          description: Read-only Join reconciliation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOperation'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/batches/{batchId}/join-operation:
    get:
      operationId: getJoinOperation
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
        - $ref: '#/components/parameters/TargetPage'
        - $ref: '#/components/parameters/TargetPageSize'
      responses:
        '200':
          description: Durable whole-batch join operation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOperation'
        default:
          $ref: '#/components/responses/Problem'
  /api/owner/v1/join-operations/needs-attention:
    get:
      operationId: listJoinOperationsNeedingAttention
      security:
        - ownerSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Join operations requiring Owner review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinOperationList'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: tsw_session
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccountSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - name_asc
    WorkspaceSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - updated_desc
          - name_asc
          - active_until_asc
    WorkspaceStateFilter:
      name: operational_state
      in: query
      schema:
        type: string
        enum:
          - unknown
          - operational
          - deactivated
          - not_found
    ObservationPage:
      name: observation_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ObservationPageSize:
      name: observation_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MemberPage:
      name: member_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    MemberPageSize:
      name: member_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TargetSort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_desc
          - identifier_asc
          - probed_desc
    TargetStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
          - active
          - disabled
    TargetProbeStatusFilter:
      name: probe_status
      in: query
      schema:
        type: string
        enum:
          - available
          - credential_invalid
          - definitely_unavailable
          - transient_failure
          - unknown
          - unprobed
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 254
    BindingId:
      name: binding_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    TargetPage:
      name: target_page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    TargetPageSize:
      name: target_page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReadId:
      name: readId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountId:
      name: targetAccountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProbeId:
      name: probeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetAccountIdQuery:
      name: target_account_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CsrfToken:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
        - factorType
        - factor
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
        factorType:
