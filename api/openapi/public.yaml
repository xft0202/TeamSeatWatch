openapi: 3.1.0
info:
  title: TeamSeatWatch Public API
  version: 1.0.0
  description: Public card redemption and current delivery access.
servers:
  - url: /
paths:
  /api/public/v1/redeem/confirm:
    post:
      operationId: confirmRedeem
      description: >-
        Directly redeem the card; the service creates the first order or
        restores the original order automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
      responses:
        '200':
          description: First order created or original order restored
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemConfirmation'
        default:
          $ref: '#/components/responses/Problem'
  /api/public/v1/redeem/state:
    get:
      operationId: getRedeemState
      security:
        - customerAccess: []
      responses:
        '200':
          description: Current state bound to the customer access cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemState'
        default:
          $ref: '#/components/responses/Problem'
  /api/public/v1/redeem/records:
    get:
      operationId: listRedeemRecords
      security:
        - customerAccess: []
      responses:
        '200':
          description: Redacted timeline for the original card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemTimeline'
        default:
          $ref: '#/components/responses/Problem'
  /api/public/v1/redeem/credential-status:
    post:
      operationId: checkRedeemCredentialStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
      responses:
        '200':
          description: Persisted status and an explicitly queued read-only check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/public/v1/redeem/reclaim:
    post:
      operationId: requestRedeemReclaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardRequest'
      responses:
        '202':
          description: OAuth reclaim accepted or already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclaimStatus'
        default:
          $ref: '#/components/responses/Problem'
  /api/public/v1/redeem/reclaim/status:
    get:
      operationId: getRedeemReclaimStatus
      security:
        - customerAccess: []
      responses:
        '200':
          description: Read-only OAuth reclaim status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReclaimStatus'
        default:
          $ref: '#/components/responses/Problem'

  /api/public/v1/redeem/download:
    post:
      operationId: downloadRedeemDelivery
      security:
        - customerAccess: []
      responses:
        '200':
          description: >-
            Current immutable delivery payload; the browser packages it
            into the customer ZIP
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    customerAccess:
      type: apiKey
      in: cookie
      name: tsw_redeem_access
  responses:
    Problem:
      description: Public error without object existence details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CardRequest:
      type: object
      additionalProperties: false
      required: [cardSecret]
      properties:
        cardSecret:
          type: string
          minLength: 4
          maxLength: 128
          pattern: '^TSW1-[A-Za-z0-9_-]+$'
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [occurredAt, action, result]
      properties:
        occurredAt:
          type: string
          format: date-time
        action:
          type: string
          enum:
            - preview
            - first_claim
            - order_restore
            - status_check
            - state_read
            - records_read
            - download_authorized
            - download_denied
            - reclaim_request
            - reclaim_status
        result:
          type: string
          enum:
            - accepted
            - denied
            - queued
            - checking
            - restored
            - unrecoverable
            - healthy
            - need_reclaim
            - cannot_reclaim
            - unknown
        reason:
          type: string
          maxLength: 128
    RedeemPreview:
      type: object
      additionalProperties: false
      required:
        - cardSuffix
        - hasOrder
        - canClaim
        - canAccess
        - remainingSeconds
        - deliveryStatus
        - livenessStatus
      properties:
        cardSuffix:
          type: string
          minLength: 4
          maxLength: 12
        hasOrder:
          type: boolean
        canClaim:
          type: boolean
        canAccess:
          type: boolean
        remainingSeconds:
          type: integer
          format: int64
          minimum: 0
        deliveryStatus:
          type: string
          enum: [available, unavailable]
        livenessStatus:
          type: string
          enum: [healthy, need_reclaim, cannot_reclaim, unknown]
    RedeemConfirmation:
      allOf:
        - $ref: '#/components/schemas/RedeemPreview'
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              type: string
              enum: [claimed, restored]
    RedeemState:
      allOf:
        - $ref: '#/components/schemas/RedeemPreview'
        - type: object
          additionalProperties: false
          required: [timeline]
          properties:
            timeline:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TimelineEntry'
    RedeemTimeline:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/TimelineEntry'
    CredentialStatus:
      type: object
      additionalProperties: false
      required: [status, checkQueued]
      properties:
        status:
          type: string
          enum: [healthy, need_reclaim, cannot_reclaim, unknown]
        checkQueued:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    ReclaimStatus:
      type: object
      additionalProperties: false
      required: [status, deliveryStatus, livenessStatus]
      properties:
        status:
          type: string
          enum: [not_requested, queued, running, retry_wait, succeeded, failed]
        stage:
          type: string
          enum: [probe, refresh, relogin, publish]
        tier:
          type: string
          enum: [probe_ok, token_refresh, full_relogin, unrecoverable]
        result:
          type: string
          enum: [queued, checking, healthy, restored, unrecoverable, unknown]
        deliveryStatus:
          type: string
          enum: [available, unavailable]
        livenessStatus:
          type: string
          enum: [healthy, need_reclaim, cannot_reclaim, unknown]
        retryAfterSeconds:
          type: integer
          minimum: 1
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
          maxLength: 160
        retryAfterSeconds:
          type: integer
          minimum: 1
